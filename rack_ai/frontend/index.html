<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera 09 • Rack Monitor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101923;color:#e8f0f7;font:16px/1.6 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}h1{font-size:24px}section{background:#192735;border:1px solid #354859;padding:20px;border-radius:10px;margin:20px 0}.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}img{width:100%;max-height:70vh;object-fit:contain;background:#0a1017}button,input{font:inherit;padding:10px;border-radius:5px;border:1px solid #567086}button{background:#13707b;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}input{background:#0f1d2a;color:white;max-width:100%}.count{font-size:64px;font-weight:700;color:#63e2d8}dl{display:grid;grid-template-columns:1fr 1fr;gap:10px}dd{margin:0}#message{color:#ffca80;min-height:1.6em}.controls{display:flex;gap:10px;flex-wrap:wrap}li{overflow-wrap:anywhere;margin:12px 0}small{color:#b3c5d4}@media(max-width:750px){.grid{grid-template-columns:1fr}main{padding:12px}}
</style></head><body><main>
<header><h1>Camera 09 / นับเก๊ะออก</h1><span id="connection" role="status">ยังไม่เชื่อมต่อ</span></header>
<form id="connect"><label>API token (ถ้าตั้งไว้) <input id="token" type="password" autocomplete="off"></label> <button>เชื่อมต่อ</button></form>
<div class="grid"><section><img id="video" alt="ภาพสดพร้อมกรอบเก๊ะจาก AI"><p id="message" role="status"></p></section>
<section><span>จำนวนเก๊ะออก · รอบที่เปิดระบบนี้</span><div class="count" id="count">—</div><dl><dt>กล้อง FPS</dt><dd id="camera">—</dd><dt>AI FPS</dt><dd id="inference">—</dd><dt>เก๊ะที่ติดตาม</dt><dd id="tracks">—</dd><dt>โมเดล</dt><dd id="model">—</dd></dl><p id="recording">ยังไม่ได้บันทึก</p><small>ยอดเป็นผลจากโมเดล ยังต้องตรวจเทียบกับคน โดยเฉพาะเก๊ะติดกัน</small></section></div>
<section><h2>บันทึกคลิปดิบสำหรับชุดข้อมูล</h2><div class="controls"><button data-minutes="10">เริ่ม 10 นาที</button><button data-minutes="15">เริ่ม 15 นาที</button><label>นาที <input id="minutes" type="number" min="1" max="60" value="10" style="width:85px"></label><button id="custom">เริ่มตามกำหนด</button><button id="stop">หยุดบันทึก</button><button id="history">โหลดประวัติ</button></div><ul id="clips"></ul><small>บันทึกภาพดิบเท่านั้น ไม่ฝังกรอบ AI ลงในไฟล์ฝึก</small></section>
</main><script src="/monitor.js" defer></script></body></html>
